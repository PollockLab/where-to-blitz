<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Complete checklists · Where to Blitz</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Tokens, panel card, presets, legend card, popup and mobile sheet copied from webapp/index.html. */
:root{--bg:#0f1620;--panel:#172230;--ink:#e8eef5;--mut:#9fb2c6;--acc:rgb(139,168,132);--gd:#22c55e;--gold:#f0a000;
  --acc-ink:#4f6b47;--gd-ink:#15803d;--gold-ink:#a16207}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Inter',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
h1,.sec,.popsec{font-family:'Space Grotesk','Inter',sans-serif}
#app{display:flex;height:100%;position:relative}
#map{flex:1;height:100%}
#panel{position:absolute;z-index:1100;top:12px;left:12px;width:300px;max-height:calc(100% - 24px);display:flex;flex-direction:column;overflow:hidden;background:var(--panel);border-radius:12px;border:1px solid #2a3a4d;box-shadow:0 6px 22px rgba(0,0,0,.5)}
#panel{--ink:#16202c;--mut:#5d6b7a;--panel:#fff;--acc:var(--acc-ink);--gd:var(--gd-ink);--gold:var(--gold-ink);color:var(--ink);border-color:#dfe5ec;box-shadow:0 6px 22px rgba(20,40,70,.16)}
#panelInner{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 15px 18px}
h1{font-size:20.5px;line-height:1.16;margin:0 0 2px}
.sub{color:var(--mut);font-size:14px;line-height:1.45;margin:0 0 8px}
.sec{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 8px;font-weight:700}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.presets button{flex:1 1 auto;background:#10203044;color:var(--ink);border:1px solid #2a3a4d;border-radius:14px;padding:5px 10px;font-size:14px;cursor:pointer;font-family:inherit}
#panel .presets button{border-color:#d4dde6;background:#f4f7fa}
.presets button:hover{border-color:var(--acc);color:var(--acc)}
#panel .presets button.on{border-color:var(--acc);background:var(--acc);color:#fff}
.hint{color:var(--mut);font-size:12.5px;line-height:1.4;margin:4px 0 0}
#latest{list-style:none;margin:0;padding:0}
#latest li button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:#f4f7fa;border:1px solid #d4dde6;border-radius:7px;padding:6px 8px;margin:0 0 5px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
#latest li button:hover{border-color:var(--acc)}
#latest .when{font-variant-numeric:tabular-nums;color:var(--mut);margin-left:auto;white-space:nowrap}
#maplegend{position:fixed;bottom:24px;right:14px;z-index:1050;background:rgba(255,255,255,.93);border-radius:9px;padding:6px 10px 8px;box-shadow:0 2px 10px rgba(0,0,0,.22);font-size:14px;color:#16233a;min-width:188px;max-width:244px;line-height:1.25;max-height:calc(100% - 48px);overflow-y:auto}
#maplegend .lt{font-weight:700;font-size:14px;margin-bottom:4px}
#maplegend label{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer;font-size:13.5px}
#maplegend input{accent-color:var(--acc-ink);margin:0}
#maplegend .n{margin-left:auto;color:#46566a;font-size:12px;font-variant-numeric:tabular-nums}
#maplegend .hint{color:#46566a;font-size:10.5px;margin-top:4px}
.sym{flex:none;width:12px;height:12px}
.maplibregl-popup{z-index:1150}
.maplibregl-popup-content{--ink:#16202c;--mut:#5d6b7a;color:var(--ink);font-size:15px;padding:12px 16px 14px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.25);max-height:calc(75dvh - 64px);overflow-y:auto}
.maplibregl-popup-content b{color:#0a2a44}
.maplibregl-popup-close-button{min-width:26px;min-height:26px;font-size:18px;padding:0 5px;color:#667}
.popsec{font-size:12.5px;font-weight:700;color:#0a2a44;margin:9px 0 5px}
.popsec:first-child{margin-top:1px;padding-right:28px}
.poprow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:2px 0}
.poprow span:first-child{color:var(--mut)}
.rule{display:flex;gap:6px;align-items:baseline;font-size:14px;padding:1px 0}
.rule .ok{color:var(--gd-ink);font-weight:700}.rule .no{color:#9aa7b5;font-weight:700}
.maplibregl-ctrl-bottom-left{left:14px;bottom:14px;z-index:1060}
@media(min-width:641px){.maplibregl-ctrl-bottom-left{left:324px}}
#map .maplibregl-ctrl-attrib{color:#263742;background:rgba(255,255,255,.96)}
.maplibregl-ctrl-attrib a{text-decoration:underline}
@media(max-width:640px){
  #app{display:block;height:100dvh}
  #map{position:absolute;inset:0;width:100%;height:100%}
  #panel{position:fixed;inset:auto 8px 8px;width:auto;max-height:46dvh;border-radius:14px}
  #maplegend{left:auto;right:8px;bottom:auto;top:8px;min-width:0;max-width:210px;max-height:38dvh;padding:8px 10px}
  .maplibregl-ctrl-bottom-left{display:none}
  body:has(.maplibregl-popup) #panel,body:has(.maplibregl-popup) #maplegend{visibility:hidden;pointer-events:none}
}
</style>
</head>
<body>
<div id="app">
<div id="panel" role="main"><div id="panelInner">
  <h1>Complete checklists</h1>
  <p class="sub">A cell lights up once its list for a group counts as complete. Research preview, iNaturalist research-grade records, export of 2026-09-27.</p>
  <div class="sec">Latest checklists</div>
  <ol id="latest"></ol>
  <p class="hint" id="latestnote"></p>
  <div class="sec">Lit when</div>
  <div class="presets" id="rule">
    <button type="button" data-v="effort"></button>
    <button type="button" data-v="chao2"></button>
  </div>
  <p class="hint" id="rulenote"></p>
  <div class="sec">Cell size</div>
  <div class="presets" id="tier">
    <button type="button" data-v="auto">Auto</button>
    <button type="button" data-v="5000">5 km</button>
    <button type="button" data-v="25000">25 km</button>
    <button type="button" data-v="100000">100 km</button>
  </div>
  <p class="hint" id="tiernote"></p>
</div></div>
<div id="map"></div>
</div>
<div id="maplegend"><div class="lt">Complete checklists</div><div id="groups"></div><div class="hint" id="legendnote"></div></div>
<script>
'use strict';
const DATA='checklist_lightup_data/';
const TIER_SWITCH_Z=9;   // the viewer's 25 km / 5 km switch (goal_presets.py)
const TIER100_Z=4.5;     // 100 km below this zoom when the tier follows zoom
const KM={5000:'5 km',25000:'25 km',100000:'100 km'};
let META,cells={},st={rule:'effort',tier:'auto',on:[]},popup=null;

const hp=()=>new URLSearchParams(location.hash.slice(1));
function readHash(){const p=hp();
  if(['effort','chao2'].includes(p.get('rule')))st.rule=p.get('rule');
  if(['auto','5000','25000','100000'].includes(p.get('tier')))st.tier=p.get('tier');
  st.on=p.has('groups')?p.get('groups').split(',').filter(g=>g in META.groups):[...META.default_on];}
function writeHash(){const p=hp();p.set('rule',st.rule);p.set('tier',st.tier);p.set('groups',st.on.join(','));
  history.replaceState(null,'','#'+p.toString().replace(/%2C/g,',').replace(/%2F/g,'/'));}
const tier=()=>st.tier!=='auto'?+st.tier:map.getZoom()<TIER100_Z?100000:map.getZoom()<=TIER_SWITCH_Z?25000:5000;
const bit=()=>st.rule==='chao2'?1:2;

// One symbol per group: hollow squares, filled dot for plants as in the sketch, hollow diamond for all biodiversity.
function symbol(g,px){const c=document.createElement('canvas');c.width=c.height=px;const x=c.getContext('2d'),
  col=META.groups[g][1],r=px/2;x.strokeStyle=col;x.fillStyle=col;x.lineWidth=px/7;
  if(g==='Plantae'){x.beginPath();x.arc(r,r,r*0.6,0,7);x.fill();}
  else if(g==='All biodiversity'){x.beginPath();x.moveTo(r,px*0.12);x.lineTo(px*0.88,r);x.lineTo(r,px*0.88);x.lineTo(px*0.12,r);x.closePath();x.stroke();}
  else x.strokeRect(px*0.2,px*0.2,px*0.6,px*0.6);
  return c;}

// The true cell as a thin square; the marker sits at the mean position of the group's records inside it.
async function footprint(q){let data={type:'FeatureCollection',features:[]};
  if(q){const c=(await load(q.t))[q.g][q.i][9],ring=[0,2,4,6,0].map(k=>[c[k],c[k+1]]);
    data={type:'Feature',geometry:{type:'Polygon',coordinates:[ring]},properties:{}};}
  map.getSource('cell').setData(data);}
async function load(t){if(!cells[t])cells[t]=fetch(DATA+t+'.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});return cells[t];}
const fc=(rows,t)=>({type:'FeatureCollection',features:Object.entries(rows).flatMap(([g,list])=>list.map(p=>({type:'Feature',
  geometry:{type:'Point',coordinates:[p[0],p[1]]},properties:{g,t,i:list.indexOf(p),m:p[2],s:p[3],c:p[4],lo:p[5],hi:p[6],d:p[7]||'',f:p[8]}})))});

const map=new maplibregl.Map({container:'map',center:[-96,58],zoom:3,minZoom:1,maxZoom:14,attributionControl:false,hash:'map',
  style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}},
    layers:[{id:'bg',type:'background',paint:{'background-color':'#f4f6f8'}},
      {id:'basemap',type:'raster',source:'osm',paint:{'raster-saturation':-1,'raster-opacity':0.35}}]}});
map.addControl(new maplibregl.AttributionControl({compact:false}),'bottom-left');
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-left');

let shown=null;
async function render(){
  const t=tier();writeHash();
  document.querySelectorAll('#rule button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.rule));
  document.querySelectorAll('#tier button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.tier));
  document.getElementById('tiernote').textContent=st.tier==='auto'?'Showing '+KM[t]+' cells; zoom in for finer cells.':'Fixed at '+KM[t]+'.';
  const rows=await load(t);
  if(shown!==t){map.getSource('lit').setData(fc(rows,t));shown=t;}
  map.setFilter('lit',['all',['in',['get','g'],['literal',st.on]],['!=',['%',['floor',['/',['get','f'],bit()]],2],0]]);
  document.querySelectorAll('#groups label').forEach(l=>{const g=l.dataset.g;
    l.querySelector('.n').textContent=(rows[g]||[]).filter(p=>p[8]&bit()).length.toLocaleString('en');
    l.querySelector('input').checked=st.on.includes(g);});
  latest(rows,t);
}
function latest(rows,t){
  const ol=document.getElementById('latest'),note=document.getElementById('latestnote');
  if(st.rule!=='effort'){ol.innerHTML='';note.textContent='Dates are for the observer-days rule. Chao2 completeness can fall as well as rise, so a Chao2 cell has no single date it lit.';return;}
  const ev=st.on.flatMap(g=>(rows[g]||[]).filter(p=>p[8]&2).map(p=>({g,p})));
  ev.sort((a,b)=>b.p[7].localeCompare(a.p[7]));
  ol.innerHTML='';
  ev.slice(0,8).forEach(({g,p})=>{const li=document.createElement('li'),b=document.createElement('button');
    b.type='button';b.appendChild(symbol(g,24)).className='sym';
    b.insertAdjacentHTML('beforeend',`<span>${META.groups[g][0]}, ${p[1].toFixed(1)}°N ${(-p[0]).toFixed(1)}°W</span><span class="when">${p[7]}</span>`);
    b.onclick=()=>{const z={100000:4.2,25000:7.5,5000:10.5}[t];
      map.flyTo({center:[p[0],p[1]],zoom:Math.max(map.getZoom(),st.tier==='auto'?z:Math.min(z,map.getZoom()+3))});
      map.once('moveend',()=>openPopup({g,t,i:rows[g].indexOf(p),m:p[2],s:p[3],c:p[4],lo:p[5],hi:p[6],d:p[7]||'',f:p[8]},[p[0],p[1]]));};
    li.appendChild(b);ol.appendChild(li);});
  note.textContent=ev.length?'The date a cell reached its '+META.effort_lit+'th observer-day. Click to fly there.':'No lit cells for the ticked groups.';
}
function openPopup(q,ll){
  const rule=(ok,txt)=>`<div class="rule"><span class="${ok?'ok':'no'}">${ok?'✓':'–'}</span><span>${txt}</span></div>`;
  const pct=v=>Math.round(v*100)+'%';
  const html=`<div class="popbody"><div class="popsec">${META.groups[q.g][0]} · ${KM[q.t]} cell</div>`+
    `<div class="poprow"><span>Observer-days</span><b>${q.m.toLocaleString('en')}</b></div>`+
    `<div class="poprow"><span>Species observed</span><b>${q.s.toLocaleString('en')}</b></div>`+
    `<div class="poprow"><span>Chao2 completeness</span><b>${pct(q.c)}</b></div>`+
    `<div class="poprow"><span>95% interval</span><span>${pct(q.lo)} to ${pct(q.hi)}</span></div>`+
    (q.d?`<div class="poprow"><span>Lit (${META.effort_lit}th observer-day)</span><span>${q.d}</span></div>`:'')+
    `<div class="popsec">Rules met</div>`+rule(q.f&2,'≥ '+META.effort_lit+' observer-days')+
    rule(q.f&1,'Chao2 completeness ≥ '+pct(META.complete)+' with ≥ '+META.min_units+' observer-days')+'</div>';
  if(popup)popup.remove();
  footprint(q);
  popup=new maplibregl.Popup({maxWidth:'290px'}).setLngLat(ll).setHTML(html).addTo(map);
  popup.on('close',()=>footprint(null));
}

(async()=>{
  META=await (await fetch(DATA+'meta.json')).json();
  readHash();
  document.querySelector('#rule [data-v=effort]').textContent='≥ '+META.effort_lit+' observer-days';
  document.querySelector('#rule [data-v=chao2]').textContent='Chao2 ≥ '+Math.round(META.complete*100)+'%';
  document.getElementById('rulenote').textContent='Observer-days: one observer on one day in the cell. Chao2: species seen over species estimated, with at least '+META.min_units+' observer-days.';
  document.getElementById('legendnote').textContent='Click a marker for its numbers.';
  const box=document.getElementById('groups');
  Object.keys(META.groups).forEach(g=>{const l=document.createElement('label');l.dataset.g=g;
    l.innerHTML='<input type="checkbox">';l.appendChild(symbol(g,24)).className='sym';
    l.insertAdjacentHTML('beforeend',`<span>${META.groups[g][0]}</span><span class="n"></span>`);
    l.querySelector('input').onchange=e=>{st.on=Object.keys(META.groups).filter(k=>k===g?e.target.checked:st.on.includes(k));render();};
    box.appendChild(l);});
  document.querySelectorAll('#rule button').forEach(b=>b.onclick=()=>{st.rule=b.dataset.v;render();});
  document.querySelectorAll('#tier button').forEach(b=>b.onclick=()=>{st.tier=b.dataset.v;render();});
  const ready=()=>new Promise(r=>map.loaded()?r():map.once('load',r));
  await ready();
  map.addSource('outline',{type:'geojson',data:META.outline});
  map.addLayer({id:'outline',type:'line',source:'outline',paint:{'line-color':'#5d6b7a','line-width':1}});
  const groups=Object.keys(META.groups);
  groups.forEach(g=>map.addImage('sym-'+g,symbol(g,28).getContext('2d').getImageData(0,0,28,28),{pixelRatio:2}));
  map.addSource('lit',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addSource('cell',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'cell',type:'line',source:'cell',paint:{'line-color':'#16202c','line-width':1.2,'line-dasharray':[2,1]}});
  // Smaller when zoomed out so dense areas stay readable; 0.55 of 14 px is about 8 px, still clickable.
  map.addLayer({id:'lit',type:'symbol',source:'lit',layout:{'icon-image':['concat','sym-',['get','g']],'icon-allow-overlap':true,
    'icon-size':['interpolate',['linear'],['zoom'],3,0.55,6,0.8,9,1,12,1.2]}});
  map.on('click','lit',e=>openPopup(e.features[0].properties,e.features[0].geometry.coordinates));
  map.on('mouseenter','lit',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','lit',()=>map.getCanvas().style.cursor='');
  map.on('zoomend',()=>{if(st.tier==='auto'&&tier()!==shown)render();});
  await render();
  document.body.dataset.ready='1';
})();
</script>
</body>
</html>
