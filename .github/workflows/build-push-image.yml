name: Build and push prebuilt raster builder image

# Manual workflow to build and push a prebuilt image with GDAL and Python deps
on:
  workflow_dispatch:
  push:
    branches:
      - 'sota/87-projected-5km-grid'
      - 'main'
    paths:
      - 'Dockerfile'
      - 'requirements.txt'


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (optional, enables multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner for GHCR tag
        id: lc
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.lc.outputs.owner }}/where-to-blitz-builder:latest
            ghcr.io/${{ steps.lc.outputs.owner }}/where-to-blitz-builder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
