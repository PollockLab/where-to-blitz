name: Rebuild grid
# Release-based flow (#87 P4): tiles are ~280 MB of derived binaries, so they are NOT
# committed to git. A manual dispatch runs the full pipeline (prepare-inputs -> per-group
# 5 km matrix -> 25 km aggregate -> validate) and, with publish: true, uploads the
# PMTiles to the grid-outputs-v1 release, whose asset URLs (S3-backed, range-request
# capable) are what the webapp fetches.
#
# Pushes to main: fast deploy-only mode. Skips expensive tile regeneration; instead uses
# the latest PMTiles from grid-outputs-v1 release and redeploys the site.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload built PMTiles to the grid-outputs-v1 release"
        type: boolean
        default: false
      validate_only:
        description: "Skip the build; validate an existing rebuilt-site artifact"
        type: boolean
        default: false
      artifact_name:
        description: "Artifact to validate when validate_only is set"
        type: string
        default: ""
  push:
    branches:
      - main
  # Without this the light checks only ran after a merge, so the lint and test gates below
  # could only ever report a regression that had already landed on main.
  pull_request:

jobs:
  validate-light:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-py-3.11
      - name: Install deps
        run: pip install ruff -r requirements.txt
      - name: Ruff check
        # Every module on the rebuild's critical path, minus three with pre-existing violations
        # that want a judgement call, not a reflex: build_hansen_ca.py (a deliberate blind catch
        # so one bad Hansen tile cannot sink the run), clip_chelsa_ca.py, build_density_pmtiles.py.
        run: ruff check build_fullgrid_ca.py fullgrid_fields.py fullgrid_outputs.py grid_lattice.py grid_schema.py goal_presets.py national_breaks.py climate_kde.py border_mask.py build_canada_mask.py build_gettingeven.py build_grid_values.py build_provenance.py aggregate_25km_from_5km.py validate_artifacts.py build_webapp.py test_climate_kde.py test_legend_ramp.py test_laea_parity.py test_gettingeven.py test_ingest_stats.py
      - name: Shell syntax
        run: bash -n rebuild_grid.sh prepare_inputs.sh publish_grid_release.sh
      - name: Tests
        # pytest.ini deselects the network-marked suite, which depends on third-party uptime
        run: pytest -q

  prepare-inputs:
    if: github.event_name == 'workflow_dispatch' && !inputs.validate_only
    runs-on: ubuntu-latest
    outputs:
      uploaded: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-py-3.11
      - name: Cache prepared inputs
        id: inputs-cache
        uses: actions/cache@v4
        with:
          # ~227 MB of travel time, bioclim and forest loss, all deterministic given these
          # three scripts and the release they pull from. Regenerating them costs ~22 min.
          path: cluster_results
          key: inputs-ca-grid-inputs-v1-${{ hashFiles('prepare_inputs.sh', 'clip_chelsa_ca.py', 'build_hansen_ca.py') }}
      - name: Install deps
        if: steps.inputs-cache.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt
      - name: Prepare shared small inputs (travel time, bioclim, forestloss)
        if: steps.inputs-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x prepare_inputs.sh
          ./prepare_inputs.sh
      - name: Upload prepared inputs
        uses: actions/upload-artifact@v4
        with:
          name: inputs-ca
          path: cluster_results
          retention-days: 7

  fit-25km:
    if: github.event_name == 'workflow_dispatch' && !inputs.validate_only
    needs: prepare-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shared inputs
        uses: actions/download-artifact@v4
        with:
          name: inputs-ca
          path: cluster_results
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-py-3.11
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build 25 km tier (fits national ramps + webapp JSON)
        env:
          GRID_RES: 25000
        run: python build_fullgrid_ca.py
      - name: Upload 25km fit artifact
        uses: actions/upload-artifact@v4
        with:
          name: fit-25km
          path: cluster_results/ca
          retention-days: 7

  matrix-build:
    if: github.event_name == 'workflow_dispatch' && !inputs.validate_only
    needs: [prepare-inputs, fit-25km]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ["All biodiversity", "Plantae", "Insecta", "Aves", "Fungi", "Mammalia", "Actinopterygii", "Reptilia", "Amphibia", "Arachnida", "Mollusca"]
    steps:
      - uses: actions/checkout@v4
      - name: Download shared inputs
        uses: actions/download-artifact@v4
        with:
          name: inputs-ca
          path: cluster_results
      - name: Download fitted national ramps (25 km tier)
        uses: actions/download-artifact@v4
        with:
          name: fit-25km
          path: cluster_results/ca
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-py-3.11
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build group grid (5 km)
        env:
          GRID_RES: 5000
        run: python build_fullgrid_ca.py --group "${{ matrix.group }}"
      - name: Derive this group's 25 km stack from its 5 km children
        run: python aggregate_25km_from_5km.py --group "${{ matrix.group }}"
      - name: Export grid values for this group (both tiers)
        run: python build_grid_values.py --group "${{ matrix.group }}"
      - name: Upload group artifact (both tiers)
        uses: actions/upload-artifact@v4
        with:
          name: grid_5000m-${{ matrix.group }}
          path: |
            cluster_results/ca/grid_5000m
            cluster_results/ca/grid_25000m
            cluster_results/ca/values
          retention-days: 7

  aggregate:
    if: github.event_name == 'workflow_dispatch' && !inputs.validate_only
    needs: [matrix-build, fit-25km]
    outputs:
      inputs_hash: ${{ steps.compute_inputs.outputs.inputs_hash }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download 25 km tier (ramps + stacks + webapp JSON)
        uses: actions/download-artifact@v4
        with:
          name: fit-25km
          path: cluster_results/ca
      - name: Download 5km artifacts from matrix jobs
        uses: actions/download-artifact@v4
        with:
          # Each grid_5000m-<group> artifact lands in its own dir (grid_5000m/ + pmtiles/ inside).
          path: .
      - name: Merge per-group 5km stacks + values into cluster_results/ca
        run: |
          set -euo pipefail
          mkdir -p cluster_results/ca/grid_5000m cluster_results/ca/grid_25000m cluster_results/ca/values
          for d in grid_5000m-*/; do
            cp "$d"grid_5000m/*.tif cluster_results/ca/grid_5000m/
            # Copy back only the 25 km stack this job actually derived. Each matrix job pulls the
            # fit-25km artifact, so its grid_25000m holds all 11 *native* stacks and only its own
            # group's is the derived one. Copying the whole directory therefore let each group
            # overwrite the previous group's derived stack with a native one, and only the
            # alphabetically last group survived - which is why 10 of 11 groups stopped nesting.
            for f in "$d"grid_5000m/*.tif; do
              cp "$d"grid_25000m/"$(basename "$f")" cluster_results/ca/grid_25000m/
            done
            cp "$d"values/*.png cluster_results/ca/values/
          done
          ls cluster_results/ca/grid_5000m | wc -l
          ls cluster_results/ca/grid_25000m | wc -l
          ls cluster_results/ca/values | wc -l
          # Every 5 km stack must have a derived 25 km twin of the same name. Anything left over
          # is a native stack no matrix job replaced, which is the failure above wearing a hat.
          missing=$(comm -23 \
            <(cd cluster_results/ca/grid_5000m && ls *.tif | sort) \
            <(cd cluster_results/ca/grid_25000m && ls *.tif | sort))
          if [ -n "$missing" ]; then
            echo "::error::these groups have no derived 25 km stack, so the tiers will not nest:"
            echo "$missing"
            exit 1
          fi
      - name: Compute inputs hash
        id: compute_inputs
        run: |
          set -euo pipefail
          REL="${GRID_INPUTS_RELEASE:-grid-inputs-v1}"
          if [ -f cluster_results/ca/breaks.json ]; then breaks_content=$(cat cluster_results/ca/breaks.json); else breaks_content=""; fi
          sha1=$(git log -n1 --pretty=format:%H -- .github/workflows/rebuild-grid.yml 2>/dev/null || echo)
          sha2=$(git log -n1 --pretty=format:%H -- build_fullgrid_ca.py 2>/dev/null || echo)
          sha3=$(git log -n1 --pretty=format:%H -- build_grid_values.py 2>/dev/null || echo)
          sha4=$(git log -n1 --pretty=format:%H -- rebuild_grid.sh 2>/dev/null || echo)
          sha5=$(git log -n1 --pretty=format:%H -- build_gettingeven.py 2>/dev/null || echo)
          sha6=$(git log -n1 --pretty=format:%H -- build_provenance.py 2>/dev/null || echo)
          INPUTS_HASH=$(printf "%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n" "$REL" "$breaks_content" "$sha1" "$sha2" "$sha3" "$sha4" "$sha5" "$sha6" | sha256sum | awk '{print $1}')
          echo "inputs_hash=$INPUTS_HASH" >> $GITHUB_OUTPUT
          echo "INPUTS_HASH=$INPUTS_HASH" >> $GITHUB_ENV
      - name: Check for existing rebuilt artifact
        id: check_artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ART_NAME="rebuilt-site-${{ steps.compute_inputs.outputs.inputs_hash }}"
          page=1
          found_id=""
          while true; do
            resp=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=$page")
            if [ -z "$resp" ]; then break; fi
            id=$(echo "$resp" | jq -r --arg NAME "$ART_NAME" '.artifacts[] | select(.name==$NAME) | .id' | head -n1)
            if [ -n "$id" ] && [ "$id" != "null" ]; then found_id="$id"; break; fi
            total=$(echo "$resp" | jq '.artifacts | length')
            if [ "$total" -lt 100 ]; then break; fi
            page=$((page+1))
          done
          if [ -n "$found_id" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "id=$found_id" >> $GITHUB_OUTPUT
            curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$found_id/zip" -o artifact.zip
            mkdir -p rebuilt-site-${{ steps.compute_inputs.outputs.inputs_hash }}
            unzip -q artifact.zip -d rebuilt-site-${{ steps.compute_inputs.outputs.inputs_hash }}
            ls -la rebuilt-site-${{ steps.compute_inputs.outputs.inputs_hash }} || true
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
      - name: Cache pip
        if: ${{ steps.check_artifact.outputs.found != 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-py-3.11
      - name: Install deps
        if: ${{ steps.check_artifact.outputs.found != 'true' }}
        run: pip install -r requirements.txt
      - name: Regenerate the Canada-only view mask from the rebuilt grid
        # us_cells.json is the vector half of the border mask; the raster half is baked into
        # the values PNGs' alpha by build_grid_values.py. Both come from border_mask.py, but only the
        # raster half was rebuilt here - the vector half was a committed file that CI never
        # touched, so editing border_mask.py silently re-split the two. They used to disagree
        # at the border; this is what stops them drifting back apart.
        if: ${{ steps.check_artifact.outputs.found != 'true' }}
        run: |
          set -euo pipefail
          cp cluster_results/ca/us_cells.json /tmp/us_cells.committed.json
          python build_canada_mask.py
      - name: Rebuild the Getting Even layer from the rebuilt grid
        # Keyed on cell centres, like us_cells.json above, and it went stale the same way:
        # the #87 lattice migration moved every cell and this file was a committed artifact
        # no build step touched, so all 31804 of its keys missed and the layer went grey.
        if: ${{ steps.check_artifact.outputs.found != 'true' }}
        run: python build_gettingeven.py
      - name: Re-freeze the provenance manifest over the rebuilt artifacts
        # Hashes what this run read and wrote. Must follow the grid build and precede the
        # upload, or the manifest describes the previous build's files.
        if: ${{ steps.check_artifact.outputs.found != 'true' }}
        run: python build_provenance.py
      - name: Rebuild webapp (index.html)
        if: ${{ steps.check_artifact.outputs.found != 'true' }}
        run: python build_webapp.py
      - name: Upload rebuilt site artifacts
        if: ${{ steps.check_artifact.outputs.found != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-site-${{ steps.compute_inputs.outputs.inputs_hash }}
          path: |
            cluster_results/ca
            index.html
          retention-days: 7
      - name: Fail if the committed view mask drifted from the rebuilt one
        # Deliberately after the upload: the freshly derived mask is the correct one and ships
        # either way, so a drift blocks the deploy (publish and deploy-site both need validate)
        # without throwing away a 30-minute rebuild. Commit the regenerated file to clear it.
        if: ${{ steps.check_artifact.outputs.found != 'true' }}
        run: |
          if ! diff -q /tmp/us_cells.committed.json cluster_results/ca/us_cells.json >/dev/null; then
            echo "::error::us_cells.json is stale - border_mask.py changed without rerunning build_canada_mask.py. Run it and commit the result."
            python -c "import json,sys; n=lambda p: len(json.load(open(p))['us_cells']); print('committed', n(sys.argv[1]), 'cells; rebuilt', n(sys.argv[2]))" /tmp/us_cells.committed.json cluster_results/ca/us_cells.json
            exit 1
          fi

      # The aggregate job runs only after all matrix jobs finish. Use actions/download-artifact
      # to fetch the per-group 5 km stacks that the aggregate run will prefer when building the
      # 25 km tier.

  validate:
    # always() so validate_only mode still runs when aggregate is skipped; in a full run,
    # validate only after a successful aggregate.
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.validate_only && inputs.artifact_name != '' || !inputs.validate_only && needs.aggregate.result == 'success') }}
    needs: aggregate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Try download artifact (hashed)
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.validate_only && inputs.artifact_name || format('rebuilt-site-{0}', needs.aggregate.outputs.inputs_hash) }}
          path: artifacts
        continue-on-error: true
      - name: Try download artifact (generic)
        uses: actions/download-artifact@v4
        with:
          name: rebuilt-site
          path: artifacts
        continue-on-error: true
      - name: List downloaded files
        run: |
          echo "Artifact root: $(pwd)/artifacts"
          ls -la artifacts || true
          ls -la artifacts/cluster_results/ca || true
      - name: Install rasterio
        run: pip install rasterio
      - name: Run validation
        id: run_validation
        continue-on-error: true
        run: |
          python validate_artifacts.py artifacts --output validate_report.json || echo $? > validate_exit_code
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validate_report.json
          retention-days: 7
      - name: Print summary
        run: |
          echo "Validation report:"
          cat validate_report.json || true
      - name: Fail on validation failure
        if: always()
        run: |
          code=0
          if [ -f validate_exit_code ]; then code=$(cat validate_exit_code); fi
          if [ "$code" -ne "0" ]; then echo "Validation failed (exit $code)"; exit $code; else echo "Validation succeeded"; fi

  publish-release:
    # Uploads the validated grid values + density PMTiles to the grid-outputs release. Only runs
    # on a manual dispatch with publish: true, after validate passes.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.validate_only
    needs: [aggregate, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # release asset upload (--clobber deletes + re-creates assets)
    steps:
      - uses: actions/checkout@v4
      - name: Download rebuilt site artifact
        uses: actions/download-artifact@v4
        with:
          name: rebuilt-site-${{ needs.aggregate.outputs.inputs_hash }}
          path: artifacts
      - name: Publish grid outputs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRID_OUTPUTS_RELEASE: grid-outputs-v1
        run: |
          set -euo pipefail
          chmod +x publish_grid_release.sh
          # publish_grid_release.sh runs rebuild_grid.sh by default; SKIP_BUILD=1 because
          # the aggregate job already built everything - just point it at the artifacts.
          mkdir -p cluster_results/ca
          cp -R artifacts/cluster_results/ca/values cluster_results/ca/ 2>/dev/null || true
          SKIP_BUILD=1 ./publish_grid_release.sh

  deploy-site:
    # Assembles the Pages site (index.html + tiles/ + webapp JSON) from the validated
    # artifacts and deploys it as a Pages artifact - nothing enters git history (#87 P4).
    # NOTE: the repo's Pages source must be "GitHub Actions" (build_type=workflow) for this
    # to go live; it stays on legacy branch-deploy until this branch merges, so Ryan's
    # #97/#98 merges keep deploying from main in the meantime.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.validate_only
    needs: [aggregate, validate]
    runs-on: ubuntu-latest
    # One Pages deployment at a time: deploy-site (dispatch) and deploy-site-fast (push to
    # main) target the same environment, and concurrent deploy-pages calls fail the loser.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download rebuilt site artifact
        uses: actions/download-artifact@v4
        with:
          name: rebuilt-site-${{ needs.aggregate.outputs.inputs_hash }}
          path: artifacts
      - name: Assemble _site
        run: |
          set -euo pipefail
          mkdir -p _site/tiles _site/cluster_results/ca
          cp artifacts/index.html _site/
          for f in blitz-logo.png og-image.png where-to-blitz-walkthrough.html; do
            [ -f "$f" ] && cp "$f" _site/
          done
          # density tiles carry a density_ prefix (matches the app's tiles/density_<Taxon>.pmtiles)
          for f in density/*.pmtiles; do cp "$f" "_site/tiles/density_$(basename "$f")"; done
          cp artifacts/cluster_results/ca/*.json _site/cluster_results/ca/
          cp -R artifacts/cluster_results/ca/values _site/cluster_results/ca/
          du -sh _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-site-fast:
    # On push to main: redeploy the site without rebuilding tiles (use latest release assets).
    # Lint validation already passed. This job rebuilds the webapp (index.html) and deploys.
    if: github.event_name == 'push'
    needs: validate-light
    runs-on: ubuntu-latest
    # One Pages deployment at a time: deploy-site (dispatch) and deploy-site-fast (push to
    # main) target the same environment, and concurrent deploy-pages calls fail the loser.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-py-3.11
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Download latest grid values from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p cluster_results/ca/values
          # Grid colours ship as a values tarball on grid-outputs-v1 (density tiles are committed in density/)
          if gh release download grid-outputs-v1 --pattern "grid_values.tar.gz" --dir . --repo "$GITHUB_REPOSITORY"; then
            tar -xzf grid_values.tar.gz -C cluster_results/ca/values
          else
            echo "No grid_values.tar.gz on the release yet"
          fi
          ls cluster_results/ca/values/ | head || echo "No values found"
      - name: Rebuild webapp
        run: python build_webapp.py
      - name: Assemble _site
        run: |
          set -euo pipefail
          mkdir -p _site/tiles _site/cluster_results/ca
          cp index.html _site/
          for f in blitz-logo.png og-image.png where-to-blitz-walkthrough.html; do
            [ -f "$f" ] && cp "$f" _site/
          done
          for f in density/*.pmtiles; do
            [ -f "$f" ] && cp "$f" "_site/tiles/density_$(basename "$f")" || true
          done
          cp cluster_results/ca/*.json _site/cluster_results/ca/ 2>/dev/null || echo "No JSON found"
          [ -d cluster_results/ca/values ] && cp -R cluster_results/ca/values _site/cluster_results/ca/ || echo "No values found"
          du -sh _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
