name: Verify hosted Getting Even inputs

on:
  pull_request:
    paths:
      - gettingeven_richness.json
      - gettingeven_reference.json
      - gettingeven_inputs.py
      - gettingeven_oracle.py
      - gettingeven_evidence.py
      - gettingeven_evidence_source.json
      - prepare_gettingeven_evidence.py
      - build_gettingeven.py
      - prepare_gettingeven_reference.py
      - test_gettingeven*.py
      - .github/workflows/verify-getting-even.yml
      - .github/workflows/rebuild-grid.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore published grid and checksum-pinned aggregate count bands
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -m pytest test_gettingeven_inputs.py test_gettingeven_reference.py -q
          mkdir "$RUNNER_TEMP/gettingeven-source"
          cp cluster_results/ca/gettingeven_grid.json cluster_results/ca/gettingeven_gate_{25000,5000}m.png "$RUNNER_TEMP/gettingeven-source/"
          bash publish_grid_release.sh --restore
          python prepare_gettingeven_reference.py --source-sidecar "$RUNNER_TEMP/gettingeven-source/gettingeven_grid.json"
          cp "$RUNNER_TEMP/gettingeven-source/"gettingeven_gate_*m.png cluster_results/ca/
          mkdir "$RUNNER_TEMP/gettingeven-before"
          cp cluster_results/ca/gettingeven_{grid,gate}_{25000,5000}m.png cluster_results/ca/webapp_data_gettingeven.json "$RUNNER_TEMP/gettingeven-before/"
      - name: Rebuild both tiers using the hosted richness inputs
        env:
          GE_RICHNESS_MANIFEST: gettingeven_richness.json
        run: |
          set -euo pipefail
          for res in 25000 5000; do
            GRID_RES="$res" python build_gettingeven.py
          done
          python - "$RUNNER_TEMP/gettingeven-before" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image
          before = Path(sys.argv[1])
          rebuilt = Path("cluster_results/ca")
          name = "webapp_data_gettingeven.json"
          assert (before / name).read_bytes() == (rebuilt / name).read_bytes(), name
          for path in before.glob("*.png"):
              with Image.open(path) as expected, Image.open(rebuilt / path.name) as actual:
                  # PNG compression varies by platform; every decoded cell must match.
                  assert (expected.mode, expected.size, expected.tobytes()) == (actual.mode, actual.size, actual.tobytes()), path.name
              print(path.name + ": identical decoded cells")
          PY
          python -m pytest test_gettingeven.py -q
      - name: Produce and verify both source-count evidence tiers
        run: |
          python gettingeven_evidence.py --output-dir cluster_results/ca
          python prepare_gettingeven_evidence.py
      - name: Retain rebuild provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-getting-even-proof
          path: |
            cluster_results/ca/gettingeven_grid.json
            cluster_results/ca/gettingeven_evidence.json
            cluster_results/ca/gettingeven_*m.png
          retention-days: 30
